<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Params.siteName }} · {{ site.Params.siteNameCN }}{{ else }}{{ .Title }} · {{ site.Params.siteName }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  {{ with .OutputFormats.Get "rss" }}
  <link rel="alternate" type="application/rss+xml" title="{{ site.Params.siteName }}" href="{{ .Permalink }}">
  {{ end }}

  <script>
    (function () {
      try {
        var t = localStorage.getItem("osdt-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  {{ partial "header.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("themeToggle");
      function paint() { if (btn) btn.textContent = root.getAttribute("data-theme") === "dark" ? "☀" : "☾"; }
      paint();
      if (btn) btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("osdt-theme", next); } catch (e) {}
        paint();
      });
      var mt = document.getElementById("menuToggle");
      var nav = document.getElementById("siteNav");
      if (mt && nav) mt.addEventListener("click", function () {
        var open = nav.classList.toggle("open");
        mt.setAttribute("aria-expanded", open ? "true" : "false");
      });
    })();
  </script>
</body>
</html>
