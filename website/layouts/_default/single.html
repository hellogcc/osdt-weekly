{{ define "main" }}
<header class="issue-head">
  <div class="wrap-wide">
    <div class="crumb"><a href="{{ "" | relURL }}">首页</a> / {{ .Title }}</div>
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<div class="meta">{{ . }}</div>{{ end }}
  </div>
</header>
<div class="wrap-wide">
  <article class="prose">
    {{ .Content }}
  </article>
  {{ partial "subscribe.html" . }}
</div>
{{ end }}
